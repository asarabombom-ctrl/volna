name: Android APK

on:
  push:
    branches: [main, android]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Volna-1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk Volna.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: Волна для Android 1.0.${{ github.run_number }}
          body: Скачай файл Volna-*.apk на телефон и открой его, чтобы установить.
          files: Volna-1.0.${{ github.run_number }}.apk
          make_latest: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Волна для Android (последняя версия)
          body: Скачай Volna.apk на телефон и открой его, чтобы установить. Новые версии ставятся поверх старой.
          files: Volna.apk
          make_latest: false
          overwrite_files: true
