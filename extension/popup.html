<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Волна</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:340px;font:14px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;color:#fff;background:#0d0b14}
.top{position:relative;padding:16px 18px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc,#7aa7ff) 45%,#0d0b14),#0d0b14);overflow:hidden}
.top h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}.top h1 img{width:26px;height:26px}
.top p{margin:4px 0 0;opacity:.75;font-size:13px}
.open{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin-top:12px;border:0;border-radius:999px;background:#fff;color:#111;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.open:hover{filter:brightness(.95)}
.sec{padding:12px 18px;border-top:1px solid rgba(255,255,255,.07)}
.sec h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;height:56px;border-radius:12px;border:2px solid transparent;background:#1c1826 center/cover;cursor:pointer;color:#fff;font-weight:700;font-size:12px;font-family:inherit;display:flex;align-items:flex-end;padding:6px 8px;text-shadow:0 1px 4px rgba(0,0,0,.8);overflow:hidden}
.th.on{border-color:var(--acc,#7aa7ff)}
.th.none{background:#030303}.th.custom{background:#1c1826;align-items:center;justify-content:center;text-align:center}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{flex:1}.row input[type=range]{flex:1.3;accent-color:var(--acc,#7aa7ff)}
.row output{width:34px;text-align:right;opacity:.7;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer}
.chip.on{background:#fff;color:#111;border-color:#fff}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.sw input{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}.chk input{accent-color:var(--acc,#7aa7ff)}
.foot{padding:10px 18px 14px;font-size:12px;opacity:.55}
kbd{font-weight:600;font-size:11px;font-family:inherit;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="top">
  <h1><img src="icons/48.png" alt="">Волна</h1>
  <p>Караоке и темы для YouTube Music</p>
  <button class="open" id="open">Открыть караоке <kbd>Alt+L</kbd></button>
</div>
<div class="sec">
  <h2>Тема</h2>
  <div class="themes" id="themes"></div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="sec">
  <h2>Акцент</h2>
  <div class="sw" id="sw"></div>
  <div class="row"><label>Затемнение фона</label><input type="range" id="dim" min="0" max="85"><output id="dimO"></output></div>
  <div class="row"><label>Размытие фона</label><input type="range" id="blur" min="0" max="40"><output id="blurO"></output></div>
  <div class="row"><label>Прозрачность панелей</label><input type="range" id="panel" min="15" max="95"><output id="panelO"></output></div>
</div>
<div class="sec">
  <h2>Караоке</h2>
  <div class="chips" id="fx"></div>
  <div class="row"><label>Размер текста</label><input type="range" id="size" min="70" max="140"><output id="sizeO"></output></div>
  <label class="chk"><input type="checkbox" id="autoOpen"> Открывать караоке само при новой песне</label>
  <label class="chk"><input type="checkbox" id="btn"> Кнопка «Волна» в панели плеера</label>
</div>
<div class="foot">Музыка играет в самом YouTube Music — с твоим Premium, без рекламы и в фоне.</div>
<script src="popup.js"></script>
</body>
</html>
